name: Private Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer from package.json (for example, 0.20.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: private-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  private-github-release:
    name: Verify and create private GitHub Release
    runs-on: macos-15
    # Containment is reachable-state arithmetic, not stacked ceilings: a failed
    # suite step (including a supervisor timeout) skips the remaining steps by
    # default, so at most one 600s ceiling is spent after setup, plus a
    # completed full run before an exhausted 600s fleet ceiling (≈17 minutes
    # with the measured ≈7–9s setup on the macos-15 runner) — inside this bound,
    # so the supervisor's bounded timeout, not the job clock, owns a hung run.
    timeout-minutes: 25
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$REPOSITORY_PRIVATE" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$MAIN_SHA"

          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$VERSION" = "$PACKAGE_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rg -F "## [$VERSION] - " CHANGELOG.md

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One candidate creation owns the build and the pack once (#550): the
      # shared from-source creator runs typecheck, bundling, and pack in a
      # single bounded build, digests the exact packed bytes, and writes the
      # identity record beside the archive. Every later consumer — the suite's
      # packed qualification, the smoke install, and the release itself —
      # consumes these exact bytes; no step rebuilds or repacks.
      - name: Create release candidate
        run: |
          archive_file="$(bun run scripts/create-package-candidate.ts "$RUNNER_TEMP/release-package")"
          echo "APKIT_TEST_PACKAGE_ARCHIVE=$archive_file" >> "$GITHUB_ENV"

      - name: Run test suite
        env:
          APKIT_TEST_PACKAGE_ARCHIVE: ${{ env.APKIT_TEST_PACKAGE_ARCHIVE }}
          APKIT_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/suite-diagnostics
        run: bun run test

      # Shared CI evidence policy: the qualification record and supervised
      # diagnostics are retained on every outcome, success and failure alike.
      - name: Upload supervised suite qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supervised-suite-qualification-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/suite-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run fleet-scale regressions
        env:
          APKIT_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/fleet-diagnostics
        run: bun run test:fleet

      # Same evidence policy as the fast run and CI's fleet job: the artifact
      # contains only what the fleet supervisor wrote; a pre-suite failure
      # leaves no record, and the failing step's log is that outcome's evidence.
      - name: Upload fleet suite qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supervised-fleet-qualification-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      # Load-bearing for golden snapshots: an uncommitted snapshot must fail
      # rather than pass silently. Snapshot updating is never enabled here.
      - name: Verify clean generated output
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Smoke-test packed CLI
        run: |
          INSTALL_ROOT="$(mktemp -d)"
          npm install --ignore-scripts --prefix "$INSTALL_ROOT" "$APKIT_TEST_PACKAGE_ARCHIVE"
          "$INSTALL_ROOT/node_modules/.bin/apkit" guide >/dev/null

      # Publication gate (#550): the release is created only for the exact
      # candidate whose required qualification succeeded — the archive's
      # actual bytes must still match its identity record, the record must
      # bind this release revision, and the retained qualification record
      # must be complete and bind the same artifact digest and source.
      - name: Verify release candidate evidence
        run: |
          bun run scripts/verify-release-candidate.ts \
            "$APKIT_TEST_PACKAGE_ARCHIVE" \
            "$GITHUB_SHA" \
            "$RUNNER_TEMP/suite-diagnostics/qualification-record.json"

      - name: Prepare release notes
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\] - " { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$MAIN_SHA"

          gh release create "v$VERSION" \
            "$APKIT_TEST_PACKAGE_ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "Agent Profile Kit $VERSION" \
            --notes-file release-notes.md
