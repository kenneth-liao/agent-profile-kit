name: Private Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer from package.json (for example, 0.20.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: private-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  private-github-release:
    name: Verify and create private GitHub Release
    runs-on: macos-15
    timeout-minutes: 20
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.17

      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$REPOSITORY_PRIVATE" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$MAIN_SHA"

          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$VERSION" = "$PACKAGE_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rg -F "## [$VERSION] - " CHANGELOG.md

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build production CLI
        run: bun run build

      - name: Run test suite
        run: bun run test

      - name: Run fleet-scale regressions
        run: bun run test:fleet

      # Load-bearing for golden snapshots: an uncommitted snapshot must fail
      # rather than pass silently. Snapshot updating is never enabled here.
      - name: Verify clean generated output
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Pack release artifact
        id: pack
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          PACKAGE_FILE="release/agent-profile-kit-$VERSION.tgz"
          test -f "$PACKAGE_FILE"
          echo "package_file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Smoke-test packed CLI
        run: |
          INSTALL_ROOT="$(mktemp -d)"
          npm install --ignore-scripts --prefix "$INSTALL_ROOT" "${{ steps.pack.outputs.package_file }}"
          "$INSTALL_ROOT/node_modules/.bin/apkit" guide >/dev/null

      - name: Prepare release notes
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\] - " { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$MAIN_SHA"

          PACKAGE_FILE="${{ steps.pack.outputs.package_file }}"
          gh release create "v$VERSION" \
            "$PACKAGE_FILE" \
            --target "$GITHUB_SHA" \
            --title "Agent Profile Kit $VERSION" \
            --notes-file release-notes.md
