name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Base SemVer from package.json (for example, 0.239.0)
        required: true
        type: string
      prerelease:
        description: Optional prerelease suffix (for example, rc.1); publishes to next from the selected ref
        required: false
        type: string
      dry-run:
        description: Qualify and retain the candidate without publishing, creating a tag, or creating a Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}-${{ inputs.prerelease }}
  cancel-in-progress: false

jobs:
  verify-release-candidate:
    name: Verify the release candidate
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRY_RUN: ${{ inputs.dry-run }}

    steps:
      - name: Select candidate directory
        run: echo "CANDIDATE=$RUNNER_TEMP/release-package" >> "$GITHUB_ENV"

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ -z "$PRERELEASE" ] && [ "$DRY_RUN" != "true" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            grep -F "## [$VERSION] - " CHANGELOG.md
          fi
          # Candidate creation validates the suffix before touching the manifest.
          # Dry runs perform no remote release/tag checks and have no write job.
          if [ "$DRY_RUN" != "true" ]; then
            # Publication waits for the whole CI matrix (macOS, Linux, Windows, every Node line) on this commit.
            bun scripts/release.ts ci-passed "$GITHUB_SHA"
            release_version="$VERSION${PRERELEASE:+-$PRERELEASE}"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$release_version" >/dev/null 2>&1; then
              echo "Tag already exists: v$release_version" >&2
              exit 1
            fi
            if gh release view "v$release_version" >/dev/null 2>&1; then
              echo "Release already exists: v$release_version" >&2
              exit 1
            fi
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Create one release candidate
        id: candidate
        run: |
          if [ -n "$PRERELEASE" ]; then
            bun scripts/release.ts candidate "$CANDIDATE" "$PRERELEASE"
          else
            bun scripts/release.ts candidate "$CANDIDATE"
          fi
          echo "version=$(node -p 'require(process.env.CANDIDATE + "/candidate.json").version')" >> "$GITHUB_OUTPUT"

      - name: Qualify the packed CLI with plain tests
        run: bun scripts/release.ts qualify "$CANDIDATE"

      - name: Retain qualification attempt on every outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-package/candidate.json
            ${{ runner.temp }}/release-package/qualification-record.json
            ${{ runner.temp }}/release-package/tests.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify release candidate evidence
        env:
          PACKED_VERSION: ${{ steps.candidate.outputs.version }}
        run: bun scripts/release.ts verify "$CANDIDATE" "$GITHUB_SHA" "$PACKED_VERSION"

      - name: Hand the verified candidate to the publishing boundary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-handoff
          path: |
            ${{ runner.temp }}/release-package/*.tgz
            ${{ runner.temp }}/release-package/candidate.json
            ${{ runner.temp }}/release-package/qualification-record.json
            ${{ runner.temp }}/release-package/tests.xml
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish the verified release
    if: ${{ !inputs.dry-run }}
    needs: [verify-release-candidate]
    # npm trusts only this environment, whose branch rules a dispatched branch cannot edit.
    environment: release
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify-release-candidate.outputs.version }}
      DIST_TAG: ${{ inputs.prerelease != '' && 'next' || 'latest' }}

    steps:
      - name: Select candidate directory
        run: echo "CANDIDATE=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Receive the verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-handoff
          path: ${{ runner.temp }}/candidate

      - name: Verify the received candidate and evidence
        run: bun scripts/release.ts verify "$CANDIDATE" "$GITHUB_SHA" "$VERSION"

      - name: Prepare release notes
        run: |
          if [ "$DIST_TAG" = "next" ]; then
            printf 'Prerelease %s from commit %s. Install with npm install --global agent-profile-kit@next.\n' "$VERSION" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          else
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\] - " { capture = 1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            test -s "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Publish to npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DIST_TAG" = "latest" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          fi
          npm install --global npm@latest
          bun scripts/release.ts verify "$CANDIDATE" "$GITHUB_SHA" "$VERSION"
          npm publish "$CANDIDATE/agent-profile-kit-$VERSION.tgz" --ignore-scripts --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release.ts verify "$CANDIDATE" "$GITHUB_SHA" "$VERSION"
          flags=()
          if [ "$DIST_TAG" = "next" ]; then flags+=(--prerelease --latest=false); fi
          # The verified record of what was tested stays with the Release, past the artifact retention.
          gh release create "v$VERSION" "$CANDIDATE/agent-profile-kit-$VERSION.tgz" \
            "$CANDIDATE/candidate.json" "$CANDIDATE/qualification-record.json" \
            --target "$GITHUB_SHA" --title "Agent Profile Kit $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
