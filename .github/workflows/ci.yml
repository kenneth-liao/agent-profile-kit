name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-supported-platform:
    name: macOS supported platform
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.17

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build production CLI
        run: bun run build:bundle

      - name: Create package archive
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          package_file="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP/package")"
          echo "APKIT_TEST_PACKAGE_ARCHIVE=$RUNNER_TEMP/package/$package_file" >> "$GITHUB_ENV"

      - name: Run test suite
        id: test_suite
        env:
          APKIT_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/suite-diagnostics
        run: bun run test

      - name: Upload failed suite diagnostics
        if: (failure() && steps.test_suite.outcome == 'failure') || (cancelled() && steps.test_suite.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supervised-suite-diagnostics-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/suite-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify clean generated output
        run: |
          git diff --check
          git diff --exit-code
